# ============================================================
# AI 聊天系统前端 nginx 配置
# 项目路径: D:\桌面\Vue\ai-chat-project
# 构建产物: dist/
# 后端地址: http://localhost:8080
#
# 使用方式（Windows nginx）:
#   1. 把本文件放到 nginx 安装目录: conf\ai-chat.conf
#   2. 在 conf\nginx.conf 的 http {} 块里加入:
#        include ai-chat.conf;
#   3. 先构建前端: npm run build
#   4. 测试配置:  nginx -t
#   5. 启动/重载: nginx -s reload （或首次启动 nginx）
# ============================================================

server {
    listen 80;
    server_name localhost;   # 部署到服务器时改为实际域名或 IP

    # 后端 API 地址（VITE_API_BASE_URL 生产环境也填 localhost:8080 即可，走本 nginx 反代）
    root D:/桌面/Vue/ai-chat-project/dist;
    index index.html;

    # 静态资源长缓存（Vite 构建产物文件名带 hash，可放心缓存一年）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 根目录 404 页面回退（可选）
    error_page 404 /index.html;

    # SPA 路由 fallback：所有前端路由都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 反向代理：/api -> 后端 Spring Boot ----
    # 前端请求 /api/chat/ask-stream -> 转发成 http://localhost:8080/chat/ask-stream
    location /api/ {
        # 去掉 /api 前缀后转发（break 表示不跳到其他 location，继续在当前 location 处理）
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://localhost:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE 流式输出关键配置（打字机效果必须） ----
        # 关闭响应缓冲，否则 AI 的回答会被 nginx 攒到一起才发给浏览器
        proxy_buffering off;
        proxy_cache off;
        # SSE 长连接不被中间层截断
        proxy_set_header Accept-Encoding identity;
        # 普通反向代理默认 60s 读超时会断掉，流式生成较慢时留足余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 可选：CORS（前后端部署在不同域名/端口时才需要打开） ----
    # 同域名部署（本配置默认场景）不需要 CORS，因为前端请求 /api/xxx 都是同域
    # 如果前端跑在 http://localhost:5173（Vite dev），请求 http://你的域名:80/api，需要后端开 CORS 或这里加：
    #
    # add_header Access-Control-Allow-Origin "http://localhost:5173" always;
    # add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    # add_header Access-Control-Allow-Credentials "true" always;
    #
    # if ($request_method = OPTIONS) {
    #     return 204;
    # }
}
